<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Ledger - Token Chat Windows</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --app-bg:#0d1117;--sidebar-bg:#161b22;--surface:#1c2128;--surface-raised:#21262d;
  --text:#e6edf3;--text-muted:#8b949e;--text-faint:#6e7681;
  --accent:#9589f7;--accent-soft:rgba(149,137,247,.12);
  --success:#56d364;--warning:#e3b341;--info:#58a6ff;
  --stack-cache:#56d364;--stack-input:#58a6ff;--stack-output:#f78166;
  --line:#30363d;--line-strong:#484f58;
  --radius:12px;
  --shadow:0 6px 20px rgba(0,0,0,.14);
  --font:-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--app-bg);color:var(--text);font-size:13px;line-height:1.5;overflow:hidden}

/* ── NAV TABS ── */
.nav-tabs{display:flex;gap:2px;background:var(--sidebar-bg);padding:4px 8px;border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;z-index:100;height:40px;align-items:center}
.nav-tab{padding:6px 16px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-muted);transition:all .15s;border:none;background:none;font-family:var(--font)}
.nav-tab:hover{color:var(--text);background:var(--surface)}
.nav-tab.active{color:var(--text);background:var(--accent-soft);font-weight:600}
.nav-tabs .brand{font-weight:700;font-size:14px;color:var(--accent);margin-right:16px;display:flex;align-items:center;gap:6px}
.nav-tabs .brand svg{width:18px;height:18px}

/* ── PAGE CONTAINER ── */
.page-container{position:fixed;top:40px;left:0;right:0;bottom:0;display:none}
.page-container.active{display:flex}

/* ── SIDEBAR ── */
.sidebar{width:244px;min-width:244px;background:var(--sidebar-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid var(--line)}
.sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sidebar-brand .logo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#7c6ee7);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sidebar-brand .logo svg{width:18px;height:18px}
.sidebar-brand .name{font-size:15px;font-weight:700;color:var(--text)}
.search-box{position:relative}
.search-box input{width:100%;padding:7px 10px 7px 30px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;font-family:var(--font);outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
.search-box .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:12px}
.conversation-list{flex:1;overflow-y:auto;padding:8px}
.conv-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative}
.conv-item:hover{background:var(--surface)}
.conv-item.active{background:var(--accent-soft)}
.conv-item .conv-title{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .conv-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.conv-item .conv-model{font-size:11px;color:var(--text-faint);background:var(--surface);padding:1px 6px;border-radius:4px}
.conv-item .conv-time{font-size:11px;color:var(--text-faint)}
.conv-item .pin-badge{position:absolute;top:10px;right:10px;font-size:10px;color:var(--accent)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sidebar-footer .archive-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:pointer}
.sidebar-footer .archive-toggle input{accent-color:var(--accent)}
.btn-new-conv{flex:1;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity .15s}
.btn-new-conv:hover{opacity:.85}

/* ── MAIN CHAT ── */
.main-area{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-toolbar{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);gap:12px;min-height:52px}
.chat-toolbar .chat-title{font-size:15px;font-weight:600}
.chat-toolbar .chat-model{font-size:11px;color:var(--text-faint);background:var(--surface);padding:2px 8px;border-radius:6px}
.chat-toolbar .toolbar-actions{margin-left:auto;display:flex;gap:4px}
.chat-toolbar .toolbar-actions button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:14px;transition:all .15s}
.chat-toolbar .toolbar-actions button:hover{background:var(--surface);color:var(--text);border-color:var(--line)}
.chat-toolbar .toolbar-actions button.active{color:var(--accent);background:var(--accent-soft)}

/* messages */
.message-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;max-width:780px;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.msg.user .avatar{background:var(--accent);color:#fff}
.msg.assistant .avatar{background:var(--success);color:#0d1117}
.msg .bubble{padding:12px 16px;border-radius:var(--radius);position:relative;line-height:1.6;font-size:13px}
.msg.user .bubble{background:var(--accent-soft);border:1px solid rgba(149,137,247,.2)}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--line)}
.msg .bubble p{margin-bottom:8px}
.msg .bubble p:last-child{margin-bottom:0}
.msg .time-stamp{font-size:11px;color:var(--text-faint);margin-top:4px}

/* code block */
.code-block{background:#0d1117;border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.code-lang{font-size:11px;color:var(--text-faint);font-weight:500}
.btn-copy{padding:3px 10px;font-size:11px;background:var(--surface-raised);border:1px solid var(--line);border-radius:6px;color:var(--text-muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-copy:hover{background:var(--line);color:var(--text)}
.btn-copy.copied{color:var(--success);border-color:var(--success)}
.code-body{padding:12px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;line-height:1.6;overflow-x:auto;color:var(--text)}
.code-body .kw{color:#ff7b72}
.code-body .fn{color:#d2a8ff}
.code-body .str{color:#a5d6ff}
.code-body .cm{color:#8b949e}
.code-body .num{color:#79c0ff}

/* token metrics */
.token-metrics{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.metric{padding:4px 10px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:4px}
.metric.cache{background:rgba(86,211,100,.1);color:var(--stack-cache);border:1px solid rgba(86,211,100,.15)}
.metric.input{background:rgba(88,166,255,.1);color:var(--stack-input);border:1px solid rgba(88,166,255,.15)}
.metric.output{background:rgba(247,129,102,.1);color:var(--stack-output);border:1px solid rgba(247,129,102,.15)}
.metric.cost{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(149,137,247,.15)}
.metric.latency{background:rgba(227,179,65,.1);color:var(--warning);border:1px solid rgba(227,179,65,.15)}
.metric .metric-label{opacity:.7}
.metric .metric-val{font-weight:600}

/* thinking block */
.thinking-block{margin:10px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.thinking-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(227,179,65,.06);cursor:pointer;font-size:12px;color:var(--warning);user-select:none;transition:background .15s}
.thinking-header:hover{background:rgba(227,179,65,.1)}
.thinking-header .arrow{transition:transform .2s;font-size:10px}
.thinking-header .arrow.open{transform:rotate(90deg)}
.thinking-body{padding:12px;font-size:12px;color:var(--text-muted);line-height:1.7;border-top:1px solid var(--line);display:none;background:rgba(0,0,0,.15)}
.thinking-body.open{display:block}

/* chat input */
.chat-input-area{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end}
.chat-input-area textarea{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;font-family:var(--font);resize:none;outline:none;min-height:42px;max-height:160px;line-height:1.5;transition:border-color .15s}
.chat-input-area textarea:focus{border-color:var(--accent)}
.btn-attach{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text-muted);cursor:pointer;font-size:16px;transition:all .15s}
.btn-attach:hover{background:var(--surface-raised);color:var(--text)}
.btn-send{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:16px;transition:opacity .15s}
.btn-send:hover{opacity:.85}

/* ── PROVIDER PAGE ── */
.provider-page{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.provider-page .page-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.provider-page .page-header h1{font-size:20px;font-weight:700}
.provider-page .page-header .header-actions{display:flex;gap:8px}
.provider-page .page-header .header-actions button{padding:7px 14px;font-size:12px;border-radius:8px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--line);background:var(--surface);color:var(--text-muted)}
.provider-page .page-header .header-actions button:hover{background:var(--surface-raised);color:var(--text)}
.provider-page .page-header .header-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.provider-page .page-header .header-actions button.primary:hover{opacity:.85}
.provider-page .page-body{flex:1;overflow-y:auto;padding:24px}

/* provider cards */
.provider-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;transition:all .2s;position:relative;overflow:hidden}
.provider-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.provider-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.provider-header{display:flex;align-items:center;padding:16px 20px;gap:12px}
.provider-header .provider-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.provider-header .provider-icon.openai{background:#10a37f}
.provider-header .provider-icon.deepseek{background:#4d6bfe}
.provider-header .provider-icon.claude{background:#cc785c}
.provider-header .provider-info{flex:1}
.provider-header .provider-name{font-size:15px;font-weight:600}
.provider-header .provider-url{font-size:11px;color:var(--text-faint);font-family:monospace}
.provider-header .health-dot{width:8px;height:8px;border-radius:50%;margin-right:4px;display:inline-block}
.provider-header .health-dot.ok{background:var(--success);box-shadow:0 0 6px rgba(86,211,100,.4)}
.provider-header .health-dot.warn{background:var(--warning);box-shadow:0 0 6px rgba(227,179,65,.4)}
.provider-header .health-text{font-size:11px;color:var(--text-muted);display:flex;align-items:center}
.provider-header .model-count{font-size:11px;color:var(--text-faint);background:var(--surface-raised);padding:2px 8px;border-radius:4px}
.provider-header .provider-actions{display:flex;gap:4px}
.provider-header .provider-actions button{padding:5px 10px;font-size:11px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--line);background:none;color:var(--text-muted)}
.provider-header .provider-actions button:hover{background:var(--surface-raised);color:var(--text)}
.provider-header .provider-actions button.test{color:var(--info);border-color:rgba(88,166,255,.2)}
.provider-header .provider-actions button.test:hover{background:rgba(88,166,255,.1)}
.provider-header .provider-actions button.danger{color:var(--stack-output);border-color:rgba(247,129,102,.2)}
.provider-header .provider-actions button.danger:hover{background:rgba(247,129,102,.1)}

/* model table */
.model-table{width:100%;border-collapse:collapse;font-size:12px}
.model-table th{text-align:left;padding:8px 16px;color:var(--text-faint);font-weight:500;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.model-table td{padding:10px 16px;border-bottom:1px solid var(--line);color:var(--text-muted)}
.model-table tr:last-child td{border-bottom:none}
.model-table tr:hover td{background:rgba(255,255,255,.02)}
.model-table .model-name{color:var(--text);font-weight:500}
.model-table .price{font-family:monospace;font-size:11px}
.model-table .ctx-window{color:var(--info)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;width:460px;box-shadow:var(--shadow)}
.modal h2{font-size:16px;margin-bottom:16px;font-weight:600}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:var(--app-bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;font-family:var(--font);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-actions button{padding:8px 18px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--line);background:var(--surface-raised);color:var(--text-muted)}
.modal-actions button:hover{color:var(--text)}
.modal-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── STATS PAGE ── */
.stats-page{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.stats-page .page-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.stats-page .page-header h1{font-size:20px;font-weight:700}
.stats-page .page-header .header-actions{display:flex;gap:8px;align-items:center}
.stats-page .page-header .header-actions button{padding:7px 14px;font-size:12px;border-radius:8px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--line);background:var(--surface);color:var(--text-muted)}
.stats-page .page-header .header-actions button:hover{background:var(--surface-raised);color:var(--text)}
.time-filter{display:flex;gap:2px;background:var(--surface);border-radius:8px;padding:2px;border:1px solid var(--line)}
.time-filter button{padding:5px 14px;font-size:11px;border-radius:6px;cursor:pointer;font-family:var(--font);border:none;background:none;color:var(--text-muted);transition:all .15s}
.time-filter button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats-page .page-body{flex:1;overflow-y:auto;padding:24px}

/* kpi cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:all .2s}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi-card:nth-child(1)::before{background:var(--accent)}
.kpi-card:nth-child(2)::before{background:var(--info)}
.kpi-card:nth-child(3)::before{background:var(--success)}
.kpi-card:nth-child(4)::before{background:var(--warning)}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-card .kpi-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-card .kpi-value{font-size:26px;font-weight:700;line-height:1}
.kpi-card .kpi-value.accent{color:var(--accent)}
.kpi-card .kpi-value.info{color:var(--info)}
.kpi-card .kpi-value.success{color:var(--success)}
.kpi-card .kpi-value.warning{color:var(--warning)}
.kpi-card .kpi-sub{font-size:11px;color:var(--text-faint);margin-top:6px}

/* stats table */
.stats-section{margin-bottom:24px}
.stats-section h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text)}
.stats-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stats-table th{text-align:left;padding:10px 16px;color:var(--text-faint);font-weight:500;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:var(--surface-raised)}
.stats-table td{padding:10px 16px;border-bottom:1px solid var(--line);color:var(--text-muted)}
.stats-table tr:last-child td{border-bottom:none}
.stats-table tr:hover td{background:rgba(255,255,255,.02)}
.stats-table .model-name{color:var(--text);font-weight:500}
.stats-table .mono{font-family:monospace;font-size:11px}

/* chart */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text)}
.chart-card svg{width:100%;height:220px}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong)}
</style>
</head>
<body>

<!-- NAV TABS -->
<div class="nav-tabs">
  <div class="brand">
    <svg viewBox="0 0 18 18"><rect x="1" y="8" width="3" height="9" rx="1" fill="var(--accent)"/><rect x="5.5" y="4" width="3" height="13" rx="1" fill="var(--accent)" opacity=".7"/><rect x="10" y="1" width="3" height="16" rx="1" fill="var(--accent)" opacity=".5"/></svg>
    Token Chat
  </div>
  <button class="nav-tab active" data-page="chat">Chat</button>
  <button class="nav-tab" data-page="provider">Provider</button>
  <button class="nav-tab" data-page="stats">Statistics</button>
</div>

<!-- ═══════════════ PAGE 1: CHAT ═══════════════ -->
<div class="page-container active" id="page-chat" style="display:flex">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" placeholder="Search conversations...">
      </div>
    </div>
    <div class="conversation-list" id="convList"></div>
    <div class="sidebar-footer">
      <label class="archive-toggle"><input type="checkbox"> Archived</label>
      <button class="btn-new-conv" onclick="newConversation()">+ New Chat</button>
    </div>
  </div>
  <div class="main-area">
    <div class="chat-toolbar">
      <span class="chat-title" id="chatTitle">Python 优化问题</span>
      <span class="chat-model" id="chatModel">gpt-4.1</span>
      <div class="toolbar-actions">
        <button title="Search">&#128269;</button>
        <button title="Compare">&#8644;</button>
        <button title="Statistics" onclick="switchPage('stats')">&#128200;</button>
        <button title="Provider" onclick="switchPage('provider')">&#9881;</button>
        <button title="Settings">&#9881;</button>
      </div>
    </div>
    <div class="message-list" id="messageList"></div>
    <div class="chat-input-area">
      <button class="btn-attach" title="Attach file">+</button>
      <textarea id="chatInput" rows="1" placeholder="Type a message... (Enter to send)" onkeydown="handleInputKey(event)"></textarea>
      <button class="btn-send" onclick="sendMessage()" title="Send">&#9654;</button>
    </div>
  </div>
</div>

<!-- ═══════════════ PAGE 2: PROVIDER ═══════════════ -->
<div class="page-container" id="page-provider">
  <div class="provider-page">
    <div class="page-header">
      <h1>Provider Management</h1>
      <div class="header-actions">
        <button>Import</button>
        <button>Export</button>
        <button class="primary" onclick="showModal()">+ Add Provider</button>
      </div>
    </div>
    <div class="page-body" id="providerList"></div>
  </div>
</div>

<!-- ═══════════════ PAGE 3: STATS ═══════════════ -->
<div class="page-container" id="page-stats">
  <div class="stats-page">
    <div class="page-header">
      <h1>Usage Statistics</h1>
      <div class="header-actions">
        <div class="time-filter">
          <button class="active" onclick="setTimeFilter(this)">All</button>
          <button onclick="setTimeFilter(this)">Today</button>
          <button onclick="setTimeFilter(this)">This Month</button>
        </div>
        <button>Export JSON</button>
        <button>Export CSV</button>
      </div>
    </div>

// ── RENDER: CONVERSATIONS ──

// ── RENDER: MESSAGES ──
function renderMessages() {
  const conv = conversations.find(c => c.id === activeConv);
  if (!conv) return;
  document.getElementById('chatTitle').textContent = conv.title;
  document.getElementById('chatModel').textContent = conv.model;
  const list = document.getElementById('messageList');
  list.innerHTML = conv.messages.map((m, i) => {
    const isUser = m.role === 'user';
    let bubbleContent = m.text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    
    // code block
    if (m.code) {
      const highlighted = m.code.body
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\b(import|from|def|return|with|as|class|if|else|for|in|and|or|not|print|True|False|None)\b/g,'<span class="kw">$1</span>')
        .replace(/\b(\w+)\(/g,'<span class="fn">$1</span>(')
        .replace(/('.*?'|".*?")/g,'<span class="str">$1</span>')
        .replace(/(#.*$)/gm,'<span class="cm">$1</span>')
        .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
      bubbleContent += `
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">${m.code.lang}</span>
            <button class="btn-copy" onclick="copyCode(this)">Copy</button>
          </div>
          <pre class="code-body">${highlighted}</pre>
        </div>`;
    }

    // thinking block
    let thinkingHTML = '';
    if (m.thinking) {
      thinkingHTML = `
        <div class="thinking-block">
          <div class="thinking-header" onclick="toggleThinking(this)">
            <span class="arrow">&#9654;</span>
            Thinking Process
          </div>
          <div class="thinking-body">${m.thinking}</div>
        </div>`;
    }

    // metrics
    let metricsHTML = '';
    if (m.metrics) {
      metricsHTML = `
        <div class="token-metrics">
          <span class="metric cache"><span class="metric-label">Cache</span> <span class="metric-val">${m.metrics.cache}</span></span>
          <span class="metric input"><span class="metric-label">Input</span> <span class="metric-val">${m.metrics.input}</span></span>
          <span class="metric output"><span class="metric-label">Output</span> <span class="metric-val">${m.metrics.output}</span></span>
          <span class="metric cost"><span class="metric-label">Cost</span> <span class="metric-val">${m.metrics.cost}</span></span>
          <span class="metric latency"><span class="metric-label">Latency</span> <span class="metric-val">${m.metrics.latency}</span></span>
        </div>`;
    }

    return `
      <div class="msg ${m.role}">
        <div class="avatar">${isUser?'U':'AI'}</div>
        <div>
          <div class="bubble">${bubbleContent}${thinkingHTML}</div>
          ${metricsHTML}
          <div class="time-stamp">${m.time}</div>

  }).join('');

}

// ── RENDER: STATS ──
function renderStats() {

  document.getElementById('kpiGrid').innerHTML = statsData.kpis.map(k => `

      <td class="mono">${m.output}</td>

    </tr>
  `).join('');

  // Chart
  renderChart();
}

function renderChart() {
  const svg = document.getElementById('costChart');
  const data = statsData.trend;
  const maxVal = Math.max(...data.map(d => d.cost)) * 1.2;
  const w = 700, h = 220, padL = 50, padR = 20, padT = 20, padB = 35;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;

  const points = data.map((d, i) => {
    const x = padL + (i / (data.length - 1)) * chartW;
    const y = padT + chartH - (d.cost / maxVal) * chartH;
    return { x, y, ...d };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ');
  const areaPath = linePath + ` L${points[points.length-1].x},${padT+chartH} L${points[0].x},${padT+chartH} Z`;

  // Grid lines
  let gridLines = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (i / 4) * chartH;
    const val = (maxVal * (1 - i / 4)).toFixed(2);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-dasharray="4,4"/>`;
    gridLines += `<text x="${padL-8}" y="${y+4}" text-anchor="end" fill="var(--text-faint)" font-size="10">$${val}</text>`;
  }

  // X labels
  let xLabels = points.map(p => `<text x="${p.x}" y="${h-8}" text-anchor="middle" fill="var(--text-faint)" font-size="10">${p.day}</text>`).join('');

  // Dots
  let dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--app-bg)" stroke-width="2"/>`).join('');

  svg.innerHTML = `
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    ${xLabels}
    <path d="${areaPath}" fill="url(#areaGrad)"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  `;
}

// ── INTERACTIONS ──
function switchPage(page) {
  document.querySelectorAll('.page-container').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector(`.nav-tab[data-page="${page}"]`).classList.add('active');
}

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => switchPage(tab.dataset.page));
});

function selectConv(id) {
  activeConv = id;
  renderConversations();
  renderMessages();
}

function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('.code-body').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function toggleThinking(header) {
  const arrow = header.querySelector('.arrow');
  const body = header.nextElementSibling;
  arrow.classList.toggle('open');
  body.classList.toggle('open');
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const conv = conversations.find(c => c.id === activeConv);
  if (!conv) return;
  conv.messages.push({
    role: 'user',
    text: text,
    time: new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false })
  });
  input.value = '';
  renderMessages();

  setTimeout(() => {
    conv.messages.push({
      role: 'assistant',
      text: 'This is a simulated response. In production, this would be an actual API call to ' + conv.model + '.',
      metrics:{ cache:'--', input:'--', output:'--', cost:'$0.00', latency:'--', total:'--' },
      time: new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false })
    });
    renderMessages();
  }, 800);
}

function newConversation() {
  const id = Date.now();
  conversations.unshift({ id, title:'New Conversation', model:'gpt-4.1-mini', time:'just now', pinned:false, messages:[
    { role:'assistant', text:'Hello! How can I help you today?', metrics:{ cache:'0', input:'120', output:'15', cost:'$0.0001', latency:'0.3s', total:'0.3s' }, time:'now' }
  ]});
  activeConv = id;
  renderConversations();
  renderMessages();
}

function showModal() { document.getElementById('modal').classList.add('show'); }
function hideModal() { document.getElementById('modal').classList.remove('show'); }
function setTimeFilter(btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
